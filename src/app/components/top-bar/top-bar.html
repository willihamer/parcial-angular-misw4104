<header class="top-bar" id="top-bar" role="banner">
  <!-- Mobile: Hamburger + Title -->
  <div class="top-bar__left d-md-none">
    <button
      class="top-bar__menu-btn"
      id="mobile-menu-btn"
      (click)="onMenuToggle()"
      aria-label="Abrir menú de navegación"
      aria-controls="side-nav"
    >
      <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="top-bar__title">DevExplorer</span>
  </div>

  <!-- Right Actions -->
  <div class="top-bar__right">
    <button class="top-bar__icon-btn" id="help-btn" aria-label="Ayuda">
      <span class="material-symbols-outlined">help</span>
    </button>
    <div class="top-bar__avatar" id="user-avatar" aria-label="Avatar de usuario" role="img">
      <img
        src="https://i.pravatar.cc/32?img=33"
        alt="Perfil del usuario actual"
      />
    </div>
  </div>
</header>
