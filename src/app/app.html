<div class="app-shell">
  <!-- Mobile Overlay -->
  <div
    class="side-nav-overlay"
    [class.visible]="isSideNavOpen"
    (click)="closeSideNav()"
    id="side-nav-overlay"
    role="presentation"
    aria-hidden="true"
  ></div>

  <!-- Sidebar -->
  <app-side-nav [class.open]="isSideNavOpen" (closeNav)="closeSideNav()"></app-side-nav>

  <!-- Main content wrapper -->
  <div class="main-wrapper">
    <!-- Top Bar -->
    <app-top-bar (menuToggle)="toggleSideNav()"></app-top-bar>

    <!-- Page Content -->
    <main class="main-canvas" id="main-content" role="main">
      <div class="container-fluid px-0">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
